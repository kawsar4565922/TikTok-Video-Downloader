<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝐓𝐢𝐤𝐓𝐨𝐤 𝐕𝐢𝐝𝐞𝐨 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝𝐞𝐫</title>
  
  <!-- Google Fonts (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0b0d14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Neon Blobs for Glass Effect */
    .background-blob-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #ff0050, #ff007f);
      border-radius: 50%;
      filter: blur(120px);
      top: 10%;
      left: 15%;
      z-index: 0;
      opacity: 0.45;
      animation: floatBlob 8s infinite alternate ease-in-out;
    }

    .background-blob-2 {
      position: absolute;
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border-radius: 50%;
      filter: blur(130px);
      bottom: 10%;
      right: 15%;
      z-index: 0;
      opacity: 0.4;
      animation: floatBlob 10s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -30px) scale(1.1); }
    }

    /* Combined Glassmorphism + Neumorphism Container */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 22, 33, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px 28px;
      border-radius: 28px;
      /* Neumorphic outer soft shadow */
      box-shadow: 
        20px 20px 50px rgba(4, 5, 8, 0.8),
        -10px -10px 40px rgba(30, 36, 54, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      text-align: center;
      width: 100%;
      max-width: 420px;
      transition: transform 0.3s ease;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #00f2fe, #ff0050);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 28px;
      font-weight: 400;
    }

    .input-box {
      position: relative;
      margin-bottom: 22px;
    }

    /* Neumorphic Inset Input Box */
    input {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      outline: none;
      background: rgba(11, 13, 20, 0.7);
      color: #fff;
      font-size: 14px;
      /* Inner Neumorphic shadow */
      box-shadow: 
        inset 4px 4px 10px rgba(0, 0, 0, 0.7),
        inset -4px -4px 10px rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    input:focus {
      border-color: rgba(0, 242, 254, 0.4);
      box-shadow: 
        inset 2px 2px 5px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(0, 242, 254, 0.25);
    }

    /* Main Action Button */
    .main-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff0050, #00f2fe);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 0, 80, 0.3);
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 242, 254, 0.4);
      filter: brightness(1.1);
    }

    .main-btn:active {
      transform: translateY(1px);
      box-shadow: 0 5px 15px rgba(255, 0, 80, 0.2);
    }

    #result {
      margin-top: 25px;
    }

    /* Glass + Neumorphic Result Card */
    .card-result {
      background: rgba(11, 13, 20, 0.6);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        inset 2px 2px 6px rgba(255, 255, 255, 0.03),
        0 10px 30px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cover-img {
      width: 140px;
      height: 180px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .video-title {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.5;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Download Buttons styling */
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #7928ca, #ff0080);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 8px 20px rgba(255, 0, 128, 0.25);
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 0, 128, 0.4);
    }

    .download-btn-normal {
      background: linear-gradient(135deg, #0070f3, #00dfd8);
      box-shadow: 0 8px 20px rgba(0, 112, 243, 0.25);
    }

    .download-btn-normal:hover {
      box-shadow: 0 12px 25px rgba(0, 223, 216, 0.4);
    }

    .status-msg {
      font-size: 14px;
      color: #00f2fe;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Ambient Background Glowing Blobs -->
  <div class="background-blob-1"></div>
  <div class="background-blob-2"></div>

  <!-- Main Dark Glassmorphism + Neumorphism Card -->
  <div class="container">
    <h2>𝐓𝐢𝐤𝐓𝐨𝐤 𝐕𝐢𝐝𝐞𝐨 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝𝐞𝐫</h2>
    <p class="subtitle"></p>

    <div class="input-box">
      <input type="text" id="videoUrl" placeholder="Insert TikTok link here...">
    </div>

    <button onclick="downloadVideo()" class="main-btn">𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝</button>

    <div id="result"></div>
  </div>

  <script>
    function downloadVideo() {
      let url = document.getElementById("videoUrl").value.trim();
      let resultDiv = document.getElementById("result");

      if (!url) {
        alert("Please fill out this field.");
        return;
      }

      resultDiv.innerHTML = "<p class='status-msg'>⏳ 𝐕𝐢𝐝𝐞𝐨 𝐏𝐫𝐨𝐜𝐞𝐬𝐬𝐢𝐧𝐠...</p>";

      // TikWM free API call
      fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`)
        .then(response => response.json())
        .then(data => {
          if (data.code === 0) {
            let hdVideoLink = data.data.hdplay ? data.data.hdplay : data.data.play; 
            let normalVideoLink = data.data.play;
            let title = data.data.title || "TikTok Video";
            let cover = data.data.cover;

            resultDiv.innerHTML = `
              <div class="card-result">
                <img src="${cover}" class="cover-img" alt="Thumbnail">
                <p class="video-title"><b>${title}</b></p>
                <button onclick="saveFile('${hdVideoLink}', 'tiktok_hd.mp4', this)" class="download-btn">🔥 𝐅𝐮𝐥𝐥 𝐇𝐃 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝</button>
                <button onclick="saveFile('${normalVideoLink}', 'tiktok_normal.mp4', this)" class="download-btn download-btn-normal">⚡ 𝐍𝐨𝐫𝐦𝐚𝐥 𝐐𝐮𝐚𝐥𝐢𝐭𝐲 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝</button>
              </div>
            `;
          } else {
            resultDiv.innerHTML = "<p style='color:#ff4757; font-size:14px;'>❌ Video খুঁজে পাওয়া যায়নি বা লিংক ভুল!</p>";
          }
        })
        .catch(error => {
          resultDiv.innerHTML = "<p style='color:#ff4757; font-size:14px;'>❌ কোনো সমস্যা হয়েছে, নেট চেক করে আবার চেষ্টা কর!</p>";
        });
    }

    // Direct download handler
    async function saveFile(fileUrl, fileName, btnElement) {
      let originalText = btnElement.innerText;
      btnElement.innerText = "⏳ 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝 𝐏𝐫𝐨𝐜𝐞𝐬𝐬𝐢𝐧𝐠...";
      btnElement.disabled = true;

      try {
        let response = await fetch(fileUrl);
        let blob = await response.blob();
        let blobUrl = URL.createObjectURL(blob);

        let a = document.createElement("a");
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        btnElement.innerText = "✅ ​𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝 𝐂𝐨𝐦𝐩𝐥𝐞𝐭𝐞!";
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.disabled = false;
        }, 3000);
      } catch (err) {
        window.open(fileUrl, "_blank");
        btnElement.innerText = originalText;
        btnElement.disabled = false;
      }
    }
  </script>

</body>
</html>
