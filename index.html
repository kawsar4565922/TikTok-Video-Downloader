<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Video Downloader</title>
  
  <!-- Google Fonts (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0d0f17;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Glowing Glass Blobs */
    .background-blob-1 {
      position: absolute;
      width: 250px;
      height: 250px;
      background: #ff0050;
      border-radius: 50%;
      filter: blur(90px);
      top: 15%;
      left: 10%;
      z-index: 0;
      opacity: 0.6;
    }

    .background-blob-2 {
      position: absolute;
      width: 280px;
      height: 280px;
      background: #00f2fe;
      border-radius: 50%;
      filter: blur(100px);
      bottom: 15%;
      right: 10%;
      z-index: 0;
      opacity: 0.5;
    }

    /* Glassmorphism Container */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 25px;
      font-weight: 400;
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      outline: none;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    input:focus {
      border-color: #ff0050;
      box-shadow: 0 0 15px rgba(255, 0, 80, 0.3);
      background: rgba(0, 0, 0, 0.5);
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, #ff0050, #fe2c55);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 0, 80, 0.35);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 0, 80, 0.5);
    }

    .main-btn:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 25px;
    }

    .card-result {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cover-img {
      width: 130px;
      height: 170px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-title {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: linear-gradient(45deg, #00b09b, #96c93d);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 6px 18px rgba(0, 176, 155, 0.3);
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 176, 155, 0.45);
    }

    .download-btn-normal {
      background: linear-gradient(45deg, #2193b0, #6dd5ed);
      box-shadow: 0 6px 18px rgba(33, 147, 176, 0.3);
    }

    .download-btn-normal:hover {
      box-shadow: 0 10px 22px rgba(33, 147, 176, 0.45);
    }

    .status-msg {
      font-size: 14px;
      color: #ffc107;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Background Glowing Blobs -->
  <div class="background-blob-1"></div>
  <div class="background-blob-2"></div>

  <!-- Main Glassmorphism Card -->
  <div class="container">
    <h2>TikTok Downloader</h2>
    <p class="subtitle"></p>

    <div class="input-box">
      <input type="text" id="videoUrl" placeholder="Insert a link here ">
    </div>

    <button onclick="downloadVideo()" class="main-btn">DOWNLOAD</button>

    <div id="result"></div>
  </div>

  <script>
    function downloadVideo() {
      let url = document.getElementById("videoUrl").value.trim();
      let resultDiv = document.getElementById("result");

      if (!url) {
        alert("Age akta TikTok video link de dost!");
        return;
      }

      resultDiv.innerHTML = "<p class='status-msg'>⏳ Video Processing...</p>";

      // TikWM free API call
      fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`)
        .then(response => response.json())
        .then(data => {
          if (data.code === 0) {
            let hdVideoLink = data.data.hdplay ? data.data.hdplay : data.data.play; 
            let normalVideoLink = data.data.play;
            let title = data.data.title || "TikTok Video";
            let cover = data.data.cover;

            resultDiv.innerHTML = `
              <div class="card-result">
                <img src="${cover}" class="cover-img" alt="Thumbnail">
                <p class="video-title"><b>${title}</b></p>
                <button onclick="saveFile('${hdVideoLink}', 'tiktok_hd.mp4', this)" class="download-btn">🔥 Full HD Download</button>
                <button onclick="saveFile('${normalVideoLink}', 'tiktok_normal.mp4', this)" class="download-btn download-btn-normal">⚡ SD / Normal Download</button>
              </div>
            `;
          } else {
            resultDiv.innerHTML = "<p style='color:#ff4757; font-size:14px;'>❌ Video khuje paoya jayni ba link vul!</p>";
          }
        })
        .catch(error => {
          resultDiv.innerHTML = "<p style='color:#ff4757; font-size:14px;'>❌ Kono somosya hoyeche, net check kore abar chesta kor!</p>";
        });
    }

    // Sorasori file download korar Magic Function
    async function saveFile(fileUrl, fileName, btnElement) {
      let originalText = btnElement.innerText;
      btnElement.innerText = "⏳ Download Processing...";
      btnElement.disabled = true;

      try {
        let response = await fetch(fileUrl);
        let blob = await response.blob();
        let blobUrl = URL.createObjectURL(blob);

        let a = document.createElement("a");
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        btnElement.innerText = "✅ Download Complete!";
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.disabled = false;
        }, 3000);
      } catch (err) {
        // Fallback jodi browser-e fetch block hoy
        window.open(fileUrl, "_blank");
        btnElement.innerText = originalText;
        btnElement.disabled = false;
      }
    }
  </script>

</body>
</html>
